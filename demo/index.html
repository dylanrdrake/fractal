<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fractal Demo</title>
  <script type="importmap">
  {
    "imports": {
      "fractal": "../src/index.js"
    }
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #383a42;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    h1 {
      margin: 0;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      background: #f0f0f1;
      border-bottom: 1px solid #e5e5e6;
      color: #a626a4;
      flex-shrink: 0;
    }

    .demo-cell {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      min-height: 0;
      min-width: 0;
      box-sizing: border-box;
    }

    .demo-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a0a1a7;
      padding: 6px 12px;
      background: #f0f0f1;
      border-bottom: 1px solid #e5e5e6;
      flex-shrink: 0;
    }

    fractal-view {
      flex: 1;
      display: block;
      min-height: 0;
    }

    /* ── Panel content ─────────────────────────────────────── */
    .pane {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.03em;

      /* --fractal-depth is set by fractal-view on itself and inherits down
         through its shadow tree into slotted content like this pane — used
         here to make deeper nesting visibly "heavier". */
      /*box-shadow: inset 10px 10px 10px calc(2px + var(--fractal-depth, 0) * 2px) rgba(0, 0, 0, calc(0.08 + var(--fractal-depth, 0) * 0.02));*/
    }
    /* goes with above --fractal-depth demo */
    /*.pane::after {
      content: "depth " attr(data-depth);
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      opacity: 0.55;
    }*/

    /* Atom One Light syntax palette: keyword / string / function / number / comment / tag */
    .pane-a { background: #d8c7d3; color: #a626a4; }
    /* Sidebar */
    #v-panel {
      #side-bar {
        border-radius: 0 10px 10px 0;
        border: 1px solid #ccc;
      }
      #side-bar[grown] {
        box-shadow: 0 0 10px 10px rgba(0, 0, 0, 0.1);
      }
      #side-bar:not([grown]) {
        width: 15px;
        overflow: hidden;
        height: 5vh;
        cursor: pointer;
      }
      #side-bar:not([grown])::after {
        content: '';
        position: absolute;
        inset: 0;
        background: gainsboro;
        border-radius: 0 10px 10px 0;
      }
      #main-content[sidebar-grown] {
        box-shadow: inset 5px 0 20px 0px rgba(0, 0, 0, 0.1);
      }
      .sidebar-close {
        position: absolute;
        top: 6px;
        right: 8px;
        width: 18px;
        height: 18px;
        padding: 0;
        border: none;
        background: none;
        color: inherit;
        opacity: 0.5;
        cursor: pointer;
        line-height: 0;
      }
      .sidebar-close:hover {
        opacity: 1;
      }
      #side-bar:not([grown]) .sidebar-close {
        display: none;
      }
    }
    .pane-b { background: #c7d6bd; color: #50a14f; }
    .pane-c { background: #c3d0d9; color: #4078f2; }
    .pane-d { background: #e3d2ac; color: #986801; }
    .pane-e { background: #d7d5cf; color: #8b8c92; font-style: italic; }
    .pane-f { background: #ddc3bf; color: #e45649; }

    /* ── Controls ──────────────────────────────────────────── */
    .controls {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: #f0f0f1;
      border-top: 1px solid #e5e5e6;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .controls label {
      font-size: 0.75rem;
      color: #696c77;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .controls button {
      padding: 4px 10px;
      background: #e5e5e6;
      border: 1px solid #d3d3d4;
      border-radius: 6px;
      color: #383a42;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.12s;
    }

    .controls button:hover {
      background: #dcdce0;
    }

    .controls input[type=range] {
      width: 100px;
      accent-color: #4078f2;
    }

  </style>
</head>
<body>

<h1>🪟 Fractal — Resizable Panels</h1>

<!-- The demo's own top-level layout is 2 nested vertical fractal-views,
     making 3 resizable panels out of the 3 showcase cells below. -->
<fractal-view split="v" initial-size="33.34" min-size="15" max-size="85" divider>

  <!-- Panel 1: Vertical split (left | right) -->
  <div slot="first" class="demo-cell" grow-on-hover="20">
    <div class="demo-label">Vertical split (left | right) · hover to grow</div>
    <fractal-view id="v-panel" split="v" initial-size="5" min-size="0" max-size="60">
      <div slot="first"  class="pane" grow-on-click="30" id="side-bar">
        Sidebar
        <button type="button" class="sidebar-close" id="sidebar-close" aria-label="Close sidebar">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round">
            <line x1="3" y1="3" x2="13" y2="13" />
            <line x1="13" y1="3" x2="3" y2="13" />
          </svg>
        </button>
      </div>
      <div slot="second" class="pane" id="main-content">Second panel</div>
    </fractal-view>
    <div class="controls">
      <label>
        Resize:
        <input type="range" min="0" max="100" value="35" id="v-slider" />
      </label>
      <button id="v-toggle-resizable">Disable resize</button>
      <button id="v-toggle-split">Switch to horizontal</button>
      <button id="v-toggle-divider">Show divider</button>
    </div>
  </div>

  <fractal-view slot="second" split="v" initial-size="50" min-size="15" max-size="85">

    <!-- Panel 2: Horizontal split (top | bottom) -->
    <div slot="first" class="demo-cell">
      <div class="demo-label">Horizontal split (top | bottom)</div>
      <fractal-view id="h-panel" split="h" initial-size="40" min-size="0" max-size="100" divider-width="6">
        <div slot="first"  class="pane pane-c">First panel</div>
        <div slot="second" class="pane pane-d">Second panel</div>
      </fractal-view>
      <div class="controls">
        <label>
          Resize:
          <input type="range" min="0" max="100" value="40" id="h-slider" />
        </label>
        <button id="h-toggle-divider">Show divider</button>
      </div>
    </div>

    <!-- Panel 3: Nested: vertical outer, horizontal inner first panel.
         The innermost split (Top/Bottom below) always has no divider — locked. -->
    <div slot="second" class="demo-cell">
      <div class="demo-label">Nested panels</div>
      <fractal-view id="nested-panel" split="v" initial-size="40" min-size="0" max-size="100" divider-width="6">
        <fractal-view slot="first" split="h" initial-size="50" min-size="0" max-size="100" divider-width="6">
          <div slot="first"  class="pane pane-e">Top</div>
          <div slot="second" class="pane pane-f">Bottom</div>
        </fractal-view>
        <div slot="second" class="pane pane-a" grow-on-hover>
          <fractal-view split="h" initial-size="50" min-size="0" max-size="100" divider-width="6">
            <div slot="first"  class="pane pane-b">Top</div>
            <div slot="second" class="pane pane-c" grow-on-hover>Bottom</div>
          </fractal-view>
        </div>
      </fractal-view>
      <div class="controls">
        <span style="font-size:0.75rem;color:#696c77;">Drag the outer or top-left dividers to resize</span>
        <button id="nested-toggle-divider">Show divider</button>
      </div>
    </div>

  </fractal-view>

</fractal-view>

<script type="module">
  import 'fractal';

  // ── Illustrate nesting depth ─────────────────────────────────────────────
  // Each <fractal-view> sets --fractal-depth on itself (see src/fractal.js).
  // Stamp it onto each pane as a plain data attribute so the CSS above can
  // show it via `content: attr(data-depth)` — attr() can't read a custom
  // property directly, so this is the bridge from custom property to badge.
  document.querySelectorAll('.pane').forEach((pane) => {
    const host = pane.closest('fractal-view');
    const depth = host?.style.getPropertyValue('--fractal-depth') ?? '0';
    pane.dataset.depth = depth.trim();
  });

  // ── Vertical panel controls ───────────────────────────────────────────────
  const vPanel = document.getElementById('v-panel');
  const vSlider = document.getElementById('v-slider');
  const vToggleResizable = document.getElementById('v-toggle-resizable');
  const vToggleSplit = document.getElementById('v-toggle-split');

  // Sidebar //
  const sidebar = document.getElementById('side-bar');
  const mainContent = document.getElementById('main-content');
  sidebar.addEventListener('panelgrow', (evt) => {
    if (evt.detail.grown) mainContent.setAttribute('sidebar-grown', '');
    else                  mainContent.removeAttribute('sidebar-grown');
  });

  // grow-on-click has no click-driven way to collapse itself (see
  // src/fractal.js), so the sidebar's own close button calls collapseGrow()
  // on its containing fractal-view directly.
  document.getElementById('sidebar-close').addEventListener('click', (e) => {
    e.stopPropagation(); // don't let it bubble into #side-bar's own click-to-grow
    document.getElementById('v-panel').collapseGrow();
  });

  vSlider.addEventListener('input', () => {
    vPanel.resize(parseFloat(vSlider.value));
  });

  // Keep the slider in sync when the size changes from the other direction
  // (e.g. dragging the divider, or resize() called elsewhere).
  vPanel.addEventListener('sizechange', (e) => {
    vSlider.value = e.detail.size;
  });

  let vResizable = true;
  vToggleResizable.addEventListener('click', () => {
    vResizable = !vResizable;
    vPanel.setAttribute('resizable', String(vResizable));
    vToggleResizable.textContent = vResizable ? 'Disable resize' : 'Enable resize';
  });

  let vSplit = 'v';
  vToggleSplit.addEventListener('click', () => {
    vSplit = vSplit === 'v' ? 'h' : 'v';
    vPanel.setAttribute('split', vSplit);
    vToggleSplit.textContent = vSplit === 'v' ? 'Switch to horizontal' : 'Switch to vertical';
  });

  // ── Horizontal panel controls ─────────────────────────────────────────────
  const hPanel = document.getElementById('h-panel');
  const hSlider = document.getElementById('h-slider');

  hSlider.addEventListener('input', () => {
    hPanel.resize(parseFloat(hSlider.value));
  });

  hPanel.addEventListener('sizechange', (e) => {
    hSlider.value = e.detail.size;
  });

  // ── Divider toggle buttons (one per main pane) ────────────────────────────
  function wireDividerToggle(panel, button) {
    const sync = () => {
      button.textContent = panel.hasAttribute('divider') ? 'Hide divider' : 'Show divider';
    };
    button.addEventListener('click', () => {
      panel.toggleAttribute('divider');
      sync();
    });
    sync();
  }

  wireDividerToggle(vPanel, document.getElementById('v-toggle-divider'));
  wireDividerToggle(hPanel, document.getElementById('h-toggle-divider'));
  wireDividerToggle(document.getElementById('nested-panel'), document.getElementById('nested-toggle-divider'));
</script>

</body>
</html>
